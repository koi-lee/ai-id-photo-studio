name: CI

# 跨平台回归：验证后处理链在 Linux / macOS / Windows 上输出一致。
# 这是「不只在我的机器上能跑」的客观证据。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 核心后处理链：三系统 × 两 Python 版本
  # 校验 8 种规格 × 3 个档位 = 24 项的像素尺寸与 DPI
  # ---------------------------------------------------------------
  selfcheck:
    name: selfcheck · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        # CI 无图形界面，用 headless 版避免 Linux 上缺 libGL 动态库；
        # cv2 API 与 opencv-python 完全一致
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0" "numpy>=1.24" "opencv-python-headless>=4.8"

      - name: 规格自检（8 规格 × 3 档位）
        run: python skill/scripts/selfcheck.py

  # ---------------------------------------------------------------
  # 可选脚本冒烟测试：确认入口能正常导入与解析参数
  # 单独一个 job，因为 mediapipe 体积大，不必进矩阵
  # ---------------------------------------------------------------
  optional-scripts:
    name: 可选脚本冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装完整依赖（含 mediapipe）
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0" "numpy>=1.24" "opencv-python-headless>=4.8" mediapipe

      - name: 命令行入口冒烟测试
        run: |
          python skill/scripts/nose_liquify.py --help
          python skill/scripts/nose_symmetry_fix.py --help
